[greeter]
background = /usr/share/backgrounds/zyphor-login-bg.jpg
theme-name = Zyphor-Dark
icon-theme-name = Flat-Remix-Blue-Dark
font-name = Cantarell 12
xft-antialias = true
xft-dpi = 96
xft-hintstyle = slight
xft-rgba = rgb
indicators = ~spacer;~session;~a11y;~clock;~power;
clock-format = %H:%M
screensaver-timeout = 60
# Ships in the image at /usr/share/pixmaps/zyphor-avatar.png (see also
# /etc/skel/.face.icon). Do not point this at a file that does not exist:
# the greeter then falls back to the stock grey silhouette.
default-user-image = /usr/share/pixmaps/zyphor-avatar.png
position = 50% 50%
panel-position = top
