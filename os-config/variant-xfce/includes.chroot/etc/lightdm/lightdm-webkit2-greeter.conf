# Zyphor OS — lightdm-webkit2-greeter configuration.
#
# Only read when the machine actually has lightdm-webkit2-greeter installed;
# see hooks/live/zyphor-greeter-session.chroot for greeter-session selection.

[greeter]

# Older lightdm-webkit2-greeter reads webkit_theme, newer web-greeter reads
# webkit-theme. Both keys are harmless to the other implementation.
webkit_theme = zyphor
webkit-theme = zyphor

# Do not let the greeter probe $HOME/.cache for themes.
detect_theme = false

# Set to true when debugging the theme: prints the WebKit console to the log.
debug_mode = false
